spring:
  application:
    name: campuscompute-backend
  
  datasource:
    url: jdbc:postgresql://localhost:5432/campuscompute
    username: reachinbox
    password: password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update  # Creates/updates tables automatically
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    defer-datasource-initialization: true  # Run data.sql after schema creation
  
  sql:
    init:
      mode: never  # Disable data.sql execution (Hibernate will create tables)
  
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000ms
  
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-change-in-production}
  expiration: 86400000 # 24 hours in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds

# Agent Configuration
agent:
  heartbeat-timeout: 60000 # 60 seconds
  mTLS:
    enabled: true
    truststore: classpath:truststore.jks
    truststore-password: ${TRUSTSTORE_PASSWORD:changeit}

# Container Configuration
container:
  default-timeout: 14400000 # 4 hours in milliseconds
  max-lifetime: 604800000 # 7 days in milliseconds
  cleanup-interval: 300000 # 5 minutes in milliseconds

# Scheduler Configuration
scheduler:
  weights:
    cpu: 0.3
    ram: 0.3
    load: 0.2
    reservation-proximity: 0.15
    reliability: 0.05

# Logging
logging:
  level:
    com.campuscompute: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
