version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: campuscompute-postgres
    environment:
      POSTGRES_DB: campuscompute
      POSTGRES_USER: campuscompute
      POSTGRES_PASSWORD: campuscompute123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - campuscompute
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuscompute -d campuscompute"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: campuscompute-redis
    ports:
      - "6379:6379"
    networks:
      - campuscompute
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  campuscompute:
    driver: bridge

volumes:
  postgres_data:
