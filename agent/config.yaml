# CampusCompute Agent Configuration

# Broker connection
broker:
  url: "ws://localhost:8081/ws/agent"  # WebSocket URL (change ws to wss for production)
  reconnect_interval: 5  # seconds
  max_reconnect_attempts: -1  # -1 for infinite
  
# Device information
device:
  id: 1  # Device ID from database (MUST be registered in backend first!)
  device_id: "LAB-PC-001"  # Unique identifier (change per machine)
  lab_name: "Computer Science Lab"  # Lab location
  hostname: ""  # Auto-detected if empty
  
# mTLS Authentication (optional - not implemented yet)
mtls:
  enabled: false  # Set to true in production
  cert_file: "certs/agent-cert.pem"
  key_file: "certs/agent-key.pem"
  ca_file: "certs/ca-cert.pem"
  
# Docker configuration
docker:
  socket: "unix:///var/run/docker.sock"  # Linux/Mac
  # socket: "npipe:////./pipe/docker_engine"  # Windows
  default_network: "campuscompute"
  image_pull_timeout: 300  # seconds
  
# Monitoring
monitoring:
  heartbeat_interval: 30  # seconds
  metrics_interval: 60  # seconds
  container_check_interval: 10  # seconds
  
# Resource limits
resources:
  max_containers: 10
  max_cpu_percent: 80  # Don't allocate if CPU > 80%
  max_ram_percent: 80  # Don't allocate if RAM > 80%
  
# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "logs/agent.log"
  max_size: 10485760  # 10 MB
  backup_count: 5
